name: Build Classic98

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-classic98
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # Android (armeabi-v7a + arm64-v8a + others)
  # ------------------------------------------------------------
  android:
    name: Android (armeabi-v7a + arm64)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/saschpe/android-ndk:34-jdk17.0.8_7-ndk25.2.9519653-cmake3.22.1
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: apt-get update && apt-get install -y make wget unzip

      - name: Retrieve build tools
        shell: bash
        run: |
          mkdir -p build-tools
          wget -q https://github.com/ClassiCube/rpi-compiling-stuff/raw/main/build-tools.zip
          unzip -o build-tools.zip -d build-tools
          chmod +x build-tools/aapt build-tools/dx build-tools/zipalign

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Classic98, OU=Classic98, O=Classic98, C=PE"

      - name: Compile Android (includes armeabi-v7a + arm64-v8a)
        shell: bash
        run: |
          COMMON_CFLAGS="-fno-stack-protector"
          make android EXTRA_CFLAGS="$COMMON_CFLAGS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Classic98-android
          path: |
            Classic98-signed.apk
            Classic98-unsigned.apk
          if-no-files-found: warn

  # ------------------------------------------------------------
  # Windows x86_64 (64-bit)
  # ------------------------------------------------------------
  windows-x64:
    name: Windows x86_64
    timeout-minutes: 20
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 + MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            make
            zip

      - name: Build Windows 64-bit
        run: |
          make windows RELEASE=1 CC=x86_64-w64-mingw32-gcc
          # Rename to clear name
          if [ -f ClassiCube.exe ]; then mv ClassiCube.exe Classic98-win64.exe; fi
          if [ -f Classic98.exe ]; then mv Classic98.exe Classic98-win64.exe; fi
          ls -la *.exe || true

      - name: Upload Windows 64-bit
        uses: actions/upload-artifact@v4
        with:
          name: Classic98-windows-x64
          path: |
            Classic98-win64.exe
            ClassiCube.exe
            *.exe
          if-no-files-found: warn

  # ------------------------------------------------------------
  # Windows x86 (32-bit)
  # ------------------------------------------------------------
  windows-x86:
    name: Windows x86 (32-bit)
    timeout-minutes: 20
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 + MinGW32
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-make
            make
            zip

      - name: Build Windows 32-bit
        run: |
          make windows RELEASE=1 CC=i686-w64-mingw32-gcc
          if [ -f ClassiCube.exe ]; then mv ClassiCube.exe Classic98-win32.exe; fi
          if [ -f Classic98.exe ]; then mv Classic98.exe Classic98-win32.exe; fi
          ls -la *.exe || true

      - name: Upload Windows 32-bit
        uses: actions/upload-artifact@v4
        with:
          name: Classic98-windows-x86
          path: |
            Classic98-win32.exe
            ClassiCube.exe
            *.exe
          if-no-files-found: warn
